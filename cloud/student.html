<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c111d">
<title>My Attendance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234f46e5'/%3E%3Ccircle cx='8' cy='6.5' r='2.6' fill='white'/%3E%3Cpath d='M3.5 13c.8-2.3 2.5-3.4 4.5-3.4s3.7 1.1 4.5 3.4' fill='white'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f5f6f8; --card: #fff; --soft: #f8f9fb; --text: #101828; --text-2: #344054; --muted: #667085; --faint: #98a2b3; --line: #e4e7ec;
          --accent: #4f46e5; --accent-2: #4338ca; --accent-soft: #eef2ff; --ok: #067647; --ok-2: #17b26a; --ok-soft: #ecfdf3; --ok-line: #abefc6;
          --warn: #b54708; --warn-soft: #fffaeb; --warn-line: #fedf89; --bad: #b42318; --bad-soft: #fef3f2; --bad-line: #fecdca;
          --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .top { background: linear-gradient(135deg, #0c111d 0%, #1e1b4b 100%); color: #fff; padding: 22px 18px 64px; }
  .top .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #6366f1, #4338ca); display: grid; place-items: center; flex: none;
          box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset; }
  .logo svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .top b { display: block; font-size: 16px; } .top span { font-size: 12.5px; color: #cecfd2; }
  .wrap { max-width: 560px; margin: -44px auto 0; padding: 0 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px;
          box-shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04); }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.015em; } h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 13.5px; font-weight: 600; color: var(--text-2); margin-bottom: 14px; }
  input { width: 100%; font: inherit; height: 46px; padding: 0 14px; border: 1px solid #d0d5dd; border-radius: 10px; margin-top: 6px; background: #fff;
          box-shadow: 0 1px 2px rgba(16,24,40,.05); }
  input:focus { outline: none; border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(99,102,241,.14); }
  button { font: inherit; font-weight: 600; height: 46px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent);
           color: #fff; width: 100%; cursor: pointer; }
  button:hover { background: var(--accent-2); }
  button.ghost { background: #fff; color: var(--text-2); width: auto; height: 36px; padding: 0 12px; border-color: #d0d5dd; font-size: 13.5px; }
  button.ghost:hover { background: var(--soft); }
  .err { color: var(--bad); font-size: 13.5px; min-height: 20px; margin-bottom: 6px; font-weight: 500; }
  .who { display: flex; align-items: center; gap: 14px; }
  .who .av { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-2); display: grid; place-items: center;
             font-weight: 700; font-size: 19px; flex: none; border: 1px solid #c7d2fe; }
  .who > div { flex: 1; min-width: 0; }
  .summary { display: flex; align-items: center; gap: 20px; }
  .ring { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--line) 0deg, var(--line) 0); }
  .ring span { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 750; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  .stat { background: var(--soft); border: 1px solid #eaecf0; border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -.01em; } .stat span { font-size: 12.5px; color: var(--muted); }
  .note { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 10px; display: none; }
  .note.ok { display: block; background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .note.warn { display: block; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
  .note.bad { display: block; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }
  .rec { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #eaecf0; }
  .rec:last-child { border: 0; padding-bottom: 0; }
  .rec img { width: 46px; height: 46px; border-radius: 12px; object-fit: cover; background: var(--soft); flex: none; border: 1px solid var(--line); }
  .rec .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--ok-soft); border: 1px solid var(--ok-line); display: grid; place-items: center; flex: none; }
  .rec .ico svg { width: 20px; height: 20px; fill: none; stroke: var(--ok); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rec .grow { flex: 1; min-width: 0; } .rec .grow div:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-flex; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-2); font-weight: 600;
         border: 1px solid #c7d2fe; white-space: nowrap; }
  .tag.manual { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
  .banner { display: none; background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
            font-weight: 600; box-shadow: 0 4px 12px rgba(23,178,106,.15); animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .empty { text-align: center; padding: 26px 10px 10px; color: var(--muted); font-size: 14px; }
  .foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 18px; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .foot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok-2); box-shadow: 0 0 0 3px rgba(23,178,106,.18); }
  @media (max-width: 420px) { .summary { flex-direction: column; align-items: stretch; } .ring { margin: 0 auto; } }
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="10.5" r="2.6"/><path d="M8 17c.8-1.8 2.2-2.7 4-2.7s3.2.9 4 2.7"/></svg></div>
  <div><b>Face Attendance</b><span>Student portal</span></div>
</div></div>
<div class="wrap">
  <div id="loginView" class="card" style="display:none">
    <h1>Sign in</h1>
    <p class="muted" style="margin:0 0 18px">Use the Login ID and PIN your teacher gave you.</p>
    <form id="loginForm">
      <label>Login ID <input id="roll" autocomplete="username" autocapitalize="characters" placeholder="e.g. FA01" required></label>
      <label>PIN <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" required></label>
      <div id="loginErr" class="err"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="meView" style="display:none">
    <div id="banner" class="banner"></div>
    <div class="card">
      <div class="who">
        <div class="av" id="meInit"></div>
        <div><h1 id="meName" style="margin:0"></h1><div class="muted" id="meRoll"></div></div>
        <button class="ghost" id="logout">Sign out</button>
      </div>
    </div>
    <div class="card">
      <div class="summary">
        <div class="ring" id="ring"><span id="sPct">-</span></div>
        <div class="stats">
          <div class="stat"><b id="sAtt">0</b><span>Classes attended</span></div>
          <div class="stat"><b id="sTot">0</b><span>Total classes</span></div>
        </div>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:4px">Attendance history</h2>
      <div id="recs"></div>
    </div>
    <p class="foot">Records come from the classroom laptop - no photos are stored online.</p>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<span class="ico"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>';
const nice = (t) => { const d = new Date(String(t).replace(" ", "T")); return isNaN(d) ? t : d.toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
let known = null, lastSig = "";

async function load() {
  const r = await fetch("/api/me");
  if (r.status === 401) { $("loginView").style.display = ""; $("meView").style.display = "none"; return; }
  const d = await r.json();
  $("loginView").style.display = "none"; $("meView").style.display = "";
  $("meName").textContent = d.name; $("meRoll").textContent = d.roll ? "Login ID " + d.roll : "";
  $("meInit").textContent = d.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  $("sAtt").textContent = d.attended; $("sTot").textContent = d.total_sessions;
  const pct = d.total_sessions ? Math.round(100 * d.attended / d.total_sessions) : null;
  const col = pct == null ? "#e4e7ec" : pct >= 75 ? "#17b26a" : pct >= 50 ? "#f79009" : "#f04438";
  $("sPct").textContent = pct == null ? "-" : pct + "%"; $("sPct").style.color = col;
  $("ring").style.background = `conic-gradient(${col} ${(pct || 0) * 3.6}deg, #eaecf0 0)`;
  $("note").className = "note " + (pct == null ? "" : pct >= 75 ? "ok" : pct >= 50 ? "warn" : "bad");
  $("note").textContent = pct == null ? "" : pct >= 75 ? "You are above the 75% attendance requirement."
    : `Below 75% - attend ${Math.max(0, Math.ceil((0.75 * d.total_sessions - d.attended) / 0.25))} more class(es) in a row to get back above it.`;
  const keys = d.records.map((h) => h.session + "|" + h.time);
  if (known) {
    const fresh = d.records.filter((h) => !known.has(h.session + "|" + h.time));
    if (fresh.length) {
      const h = fresh[0];
      $("banner").textContent = `✅ Your attendance for "${h.session}" is marked ` +
        (h.method === "auto" ? "through Face recognition" : "by your teacher") + ` at ${h.time.slice(11, 16)}`;
      $("banner").style.display = "block";
      if (navigator.vibrate) navigator.vibrate(200);
    }
  }
  known = new Set(keys);
  const sig = JSON.stringify(d.records);
  if (sig === lastSig) return;          // nothing changed: don't redraw (avoids image flicker)
  lastSig = sig;
  $("recs").innerHTML = d.records.map((h) => `
    <div class="rec">
      ${CHECK}
      <div class="grow"><div>${esc(h.session)}</div>
        <div class="muted">${esc(nice(h.time))}</div></div>
      ${h.method === "auto" ? '<span class="tag">Face</span>' : '<span class="tag manual">Manual</span>'}
    </div>`).join("") || '<div class="empty">No attendance yet. It shows up here the moment you are marked.</div>';
}

$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  const r = await fetch("/student/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ roll: $("roll").value, pin: $("pin").value }) });
  if (!r.ok) { $("loginErr").textContent = (await r.json().catch(() => ({}))).error || "Login failed"; return; }
  $("pin").value = ""; known = null; lastSig = ""; load();
};
$("logout").onclick = async () => { await fetch("/logout", { method: "POST" }); known = null; lastSig = ""; load(); };

load();
setInterval(() => { if ($("meView").style.display !== "none") load(); }, 5000);
</script>
</body>
</html>
